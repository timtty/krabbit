# Linux deployment overlay — use this on the real honeypot host.
#
# Enable it once, per host, by symlinking it to the file Compose auto-loads:
#
#     ln -s docker-compose.linux.yml docker-compose.override.yml
#
# After that plain `docker compose up -d` picks it up, with no -f flags to
# forget. `docker-compose.override.yml` is gitignored, so this stays out of the
# working tree and `git pull` never conflicts.
#
# Not for Docker Desktop (macOS/Windows) — host networking behaves differently
# there. The base docker-compose.yml already works on those platforms as-is.
services:
  kamailio:
    # Host networking so Kamailio sees the real attacker source IP. Docker's
    # userland proxy NATs packets sent from the same host, and any NAT in front
    # of Kamailio rewrites src_ip — which silently destroys src_ip, src_geo and
    # every per-IP analysis built on them. There is no error when this goes
    # wrong, only wrong data, so prefer host networking on the real deployment.
    network_mode: host
    # Published ports are meaningless under host networking (Kamailio binds the
    # host's 5060 directly) and Docker warns if they are left set.
    ports: !reset []
    # Host networking takes Kamailio off the compose network, so the
    # "opensearch" service name no longer resolves. OpenSearch already
    # publishes on 127.0.0.1:9200, so reach it there.
    environment:
      - KRABBIT_ES_URL=http://127.0.0.1:9200/sip-honeypot/_doc
      # Bind each address on this interface to its own socket, so $Ri — and
      # therefore dst_ip — reports which of our addresses an attacker hit. A
      # wildcard bind is one socket for all addresses and reports 0.0.0.0.
      # Naming the interface rather than the addresses means routing another
      # /32 to enp8s0 needs no change here, only `docker compose restart
      # kamailio`. Check the name on the host: `ip -4 -o addr show`.
      - KRABBIT_SIP_LISTEN=enp8s0
