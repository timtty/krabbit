#!KAMAILIO
#
# Krabbit - SIP honeypot -> OpenSearch (direct, no Logstash)
# ----------------------------------------------------------
# Every incoming SIP request is turned into a JSON document (built safely with
# the jansson module so attacker-controlled headers cannot corrupt the JSON)
# and POSTed to OpenSearch with the http_client (libcurl) module. After
# logging, the honeypot sends a convincing reply so scanners keep probing and,
# for REGISTER/INVITE, keep sending credential guesses we can harvest.
#
# The POST is synchronous, which is fine here: OpenSearch is on the same
# Docker network (~1-5 ms round-trip) and honeypot traffic is low volume.
#

####### Defines #######

# OpenSearch write endpoint, taken from the KRABBIT_ES_URL environment variable
# so the same config works both on the compose network ("opensearch:9200") and
# under host networking ("127.0.0.1:9200") — see docker-compose.linux.yml. The
# Dockerfile sets a default so the image is never left with an empty URL.
# "sip-honeypot" is an ISM rollover alias created by opensearch/bootstrap.sh,
# so the index part never has to change.
#!substdef "!ES_URL!$env(KRABBIT_ES_URL)!g"

# Digest realm we present. "asterisk" makes us look like an Asterisk/FreePBX PBX,
# which is what most SIP scanners (sipvicious, friendly-scanner, etc.) hunt for.
#!substdef "!REALM!asterisk!g"

####### Global Parameters #######

debug=1
log_stderror=yes          # log to stderr so `docker logs` shows activity
log_facility=LOG_LOCAL0

fork=yes
children=8                 # UDP receiver workers
tcp_children=4

auto_aliases=no
dns=no
rev_dns=no

/* Pretend to be a real PBX. This is deliberately deceptive: it makes the
   honeypot attractive and convincing to attackers. */
server_header="Server: FPBX-16.0.40(18.20.1)"
user_agent_header="User-Agent: FPBX-16.0.40(18.20.1)"
sip_warning=0

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

####### Modules #######

loadmodule "tm.so"           # loaded so sl can register stateless callbacks quietly
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "siputils.so"
loadmodule "textops.so"
loadmodule "auth.so"          # www_challenge / proxy_challenge
loadmodule "jansson.so"       # safe JSON construction (kamailio-extra-modules)
loadmodule "http_client.so"   # POST to Elasticsearch (kamailio-utils-modules)

# --- http_client ---
modparam("http_client", "connection_timeout", 2)   # seconds

# --- auth (challenge only; no credential DB, we just want the guesses) ---
modparam("auth", "nonce_expire", 300)

####### Routing Logic #######

request_route {

	# Reply to the real source IP:port, not whatever the attacker put in Via.
	# Scanners are frequently behind NAT and rely on rport to hear our bait.
	force_rport();

	# Drop blatantly malformed junk, but log everything else.
	if (!sanity_check("1511", "7")) {
		xlog("L_INFO", "honeypot: malformed request from $si:$sp\n");
		exit;
	}

	route(BUILD_DOC);   # -> $var(doc)
	route(LOG_ES);      # POST $var(doc) to Elasticsearch
	route(REPLY);       # send a believable SIP response
}

# Send a believable response that keeps the attacker engaged.
route[REPLY] {
	if (is_method("REGISTER")) {
		# Always re-challenge. Every REGISTER then carries a fresh credential
		# guess (username + digest response) that route[BUILD_DOC] captured.
		www_challenge("REALM", "0");
		exit;
	}

	if (is_method("INVITE")) {
		# 407 Proxy Authentication Required. Reveals toll-fraud dial targets
		# (the To: user, often premium/international numbers) and harvests creds.
		proxy_challenge("REALM", "0");
		exit;
	}

	if (is_method("OPTIONS")) {
		# Answer 200 so scanners mark us "alive" and probe further.
		sl_send_reply("200", "OK");
		exit;
	}

	if (is_method("ACK|CANCEL|BYE")) {
		# Nothing to answer.
		exit;
	}

	# SUBSCRIBE, PUBLISH, MESSAGE, NOTIFY, and anything else: look alive.
	sl_send_reply("200", "OK");
	exit;
}

# POST the JSON event to Elasticsearch. Synchronous; failures are logged but
# never block the attacker from getting a SIP reply.
route[LOG_ES] {
	http_client_query("ES_URL", "$var(doc)",
		"Content-Type: application/json", "$var(esres)");
	if ($rc < 0) {
		xlog("L_WARN", "honeypot: ES POST failed (curl err $rc) for $rm from $si\n");
	} else if ($rc >= 300) {
		xlog("L_WARN", "honeypot: ES POST rejected rc=$rc body=$var(esres)\n");
	}
}

# Construct the JSON event in $var(doc). jansson_set escapes all values, so
# hostile User-Agent / From / Contact headers cannot break out of the JSON.
route[BUILD_DOC] {
	$var(doc) = "{}";

	jansson_set("string",  "event_kind",   "sip-honeypot", "$var(doc)");
	jansson_set("string",  "method",       "$rm",          "$var(doc)");
	jansson_set("string",  "src_ip",       "$si",          "$var(doc)");
	jansson_set("integer", "src_port",     "$sp",          "$var(doc)");
	jansson_set("string",  "transport",    "$pr",          "$var(doc)");
	jansson_set("string",  "realm",        "REALM",        "$var(doc)");
	jansson_set("string",  "ruri",         "$ru",          "$var(doc)");
	jansson_set("string",  "from_uri",     "$fu",          "$var(doc)");
	jansson_set("string",  "from_user",    "$fU",          "$var(doc)");
	jansson_set("string",  "to_uri",       "$tu",          "$var(doc)");
	jansson_set("string",  "to_user",      "$tU",          "$var(doc)");
	jansson_set("string",  "call_id",      "$ci",          "$var(doc)");
	jansson_set("string",  "cseq",         "$hdr(CSeq)",   "$var(doc)");

	if ($ua != $null) {
		jansson_set("string", "user_agent", "$ua", "$var(doc)");
	}
	if (is_present_hf("Contact")) {
		jansson_set("string", "contact", "$hdr(Contact)", "$var(doc)");
	}

	# Asserted identity / branding. A URI never carries a brand — the display name
	# does, and on a compromised-PBX-to-carrier leg the asserted identity headers
	# do. A scanner spoofing `"WELLS FARGO" <sip:...>` or setting
	# P-Asserted-Identity is invisible in from_uri/from_user alone.
	# [*] joins repeated occurrences (P-Asserted-Identity legitimately appears
	# twice: one sip: URI and one tel: URI; Remote-Party-ID also repeats).
	# $fn/$tn keep the header's surrounding quotes ("WELLS FARGO"); strip them so
	# quoted and unquoted display names aggregate as one term.
	if ($fn != $null) {
		jansson_set("string", "from_display", "$(fn{s.unquote})", "$var(doc)");
	}
	if ($tn != $null) {
		jansson_set("string", "to_display", "$(tn{s.unquote})", "$var(doc)");
	}
	if (is_present_hf("P-Asserted-Identity")) {
		jansson_set("string", "p_asserted_identity",
			"$(hdr(P-Asserted-Identity)[*])", "$var(doc)");
	}
	if (is_present_hf("P-Preferred-Identity")) {
		jansson_set("string", "p_preferred_identity",
			"$(hdr(P-Preferred-Identity)[*])", "$var(doc)");
	}
	if (is_present_hf("Remote-Party-ID")) {
		jansson_set("string", "remote_party_id",
			"$(hdr(Remote-Party-ID)[*])", "$var(doc)");
	}

	# Credential harvesting: capture whatever the attacker sent.
	if (is_present_hf("Authorization")) {
		jansson_set("string", "auth_username", "$au",              "$var(doc)");
		jansson_set("string", "authorization", "$hdr(Authorization)", "$var(doc)");
	}
	if (is_present_hf("Proxy-Authorization")) {
		jansson_set("string", "auth_username",        "$au",                       "$var(doc)");
		jansson_set("string", "proxy_authorization",  "$hdr(Proxy-Authorization)", "$var(doc)");
	}
}
