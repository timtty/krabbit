name: krabbit

services:
  # ---- OpenSearch: the only data store. Kamailio writes straight to it. ----
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.18.0}
    container_name: krabbit-opensearch
    environment:
      - discovery.type=single-node
      - node.name=krabbit
      - DISABLE_SECURITY_PLUGIN=true          # internal backend, not exposed to the internet
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"                 # localhost only — never publish the datastore to the world
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
    restart: unless-stopped

  # ---- One-shot: create datasource / pipeline / ISM / template / write index, then exit. ----
  os-init:
    image: curlimages/curl:8.10.1
    container_name: krabbit-os-init
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OS_HOST=http://opensearch:9200
    volumes:
      - ./opensearch/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    restart: "no"

  # ---- Kamailio SIP honeypot: the only internet-facing service. ----
  kamailio:
    build: ./kamailio
    container_name: krabbit-kamailio
    depends_on:
      os-init:
        condition: service_completed_successfully
    # Where Kamailio POSTs events. Reachable by service name on the compose
    # network; the Linux overlay switches this to loopback (see below).
    environment:
      - KRABBIT_ES_URL=http://opensearch:9200/sip-honeypot/_doc
    ports:
      - "${SIP_BIND:-0.0.0.0}:5060:5060/udp"
      - "${SIP_BIND:-0.0.0.0}:5060:5060/tcp"
    restart: unless-stopped

volumes:
  osdata:
